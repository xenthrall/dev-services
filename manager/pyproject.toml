[project]
name = "manager"
version = "0.1.0"
description = "Panel web local para iniciar/detener los servicios Docker de dev-services"
readme = "README.md"
authors = [
    { name = "xenthrall", email = "xenthrall0@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
manager = "manager:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
